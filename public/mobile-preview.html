<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista movil - Portal del Paciente</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: start center;
      min-height: 100vh;
      padding: 24px;
      overflow: auto;
      background: #e8eeee;
    }

    .phone-preview {
      position: relative;
      width: 414px;
      height: 868px;
      padding: 12px;
      overflow: hidden;
      border: 1px solid #26364a;
      border-radius: 34px;
      background: #132136;
      box-shadow: 0 18px 45px rgb(15 36 54 / 22%);
    }

    .phone-preview::before {
      position: absolute;
      z-index: 2;
      top: 7px;
      left: 50%;
      width: 104px;
      height: 20px;
      border-radius: 0 0 14px 14px;
      background: #132136;
      content: "";
      transform: translateX(-50%);
      pointer-events: none;
    }

    .phone-preview iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 0;
      border-radius: 23px;
      background: #ffffff;
    }

    @media (max-width: 440px) {
      body {
        display: block;
        padding: 0;
        background: #ffffff;
      }

      .phone-preview {
        width: 100vw;
        height: 100vh;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .phone-preview::before {
        display: none;
      }

      .phone-preview iframe {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main class="phone-preview" aria-label="Vista movil del portal del paciente">
    <iframe src="/patient" title="Portal del Paciente"></iframe>
  </main>
</body>
</html>
